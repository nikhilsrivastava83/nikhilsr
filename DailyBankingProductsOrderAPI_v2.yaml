components:
  securitySchemes:
    bearerAuth:
      description: "Placeholder for Enterprise Token."
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    Trace-Id:
      description: Unique end-2-end trace id received from the consumer
      schema:
        type: string
      example: VGhpcyBpcyBhIG5pY2UgdGV4dCBlbmNvZGVkIGluIEJhc2U2NA==
    Retry-After:
      description: Number of seconds after which a retry should happen.
      schema:
        type: integer
      example: 120
  parameters:
    Order-Id:
      name: orderId
      in: path
      required: true
      description: Unique identifier of an order.
      schema:
        type: integer
        format: int64
      example: '1900237965'
    Agreement-Party-Cluster-Id:
      name: agreementPartyClusterId
      in: query
      description: Unique identifier of a customer.
      schema:
        type: integer
        format: int64
      example: '1900237965'
    Product-Id:
      name: productId
      in: query
      description: >-
        "Unique identifier of a product. For the products in scope, please refer: https://confluence.int.abnamro.com/display/OMDBPE/Product+Roadmap"
      schema:
        type: integer
        format: int64
      example: '3621'
    Order-Status:
      name: orderStatus
      in: query
      description: |
        Parameter that allows filtering of results based on the possible statuses of the order
      schema:
        type: array
        items:
          $ref: '#/components/schemas/OrderStatus'
        minItems: 1
        maxItems: 5
      style: form
      explode: false
      example: FULFILMENT_IN_PROGRESS
    Correlation-Id:
      name: correlationId
      in: query
      description: >-
        Unique identifier for an Order (if applicable), from Consumer application. For Consumer application, they may maintain correlation
        between Order ID (in response) of this API and their own Unique ID for the Order being placed.
      schema:
        type: string
      example: VGhpcyBpcyBhIG5pY2UgdGV4dCBlbmNvZGVkIGluIEJhc2U2NA==
    Page-Number:
      name: pageNumber
      in: query
      description: Number of the page to be returned. It takes values 1, 2, 3 etc. Default value
      schema:
        type: integer
        format: int32
        default: 1
      example: 1
    Page-Size:
      name: pageSize
      in: query
      description: Size of the page to be returned, where pageSize <= 100.
      schema:
        type: integer
        format: int64
        default: 20
      example: 20
    Include-Total-Number-Of-Elements:
      name: includeTotalNumberOfElements
      in: query
      description: When set to true, the total number of records in the result set is returned.
      schema:
        type: boolean
        default: false
      example: true
    From-Date-Time:
      name: fromDateTime
      in: query
      description: From date when to get the list of orders. This date will be checked against the last updated date of the order
      required: false
      schema:
        type: string
        format: date-time
      example: '2019-04-23T12:59:29.969Z'
    To-Date-Time:
      name: toDateTime
      in: query
      description: To date when to get the list of orders. This date will be checked against the last updated date of the order
      required: false
      schema:
        type: string
        format: date-time
      example: '2019-04-23T12:59:29.969Z'
    Authorization-Level:
      name: authorizationLevel
      in: query
      description: Level of assurance as we receive from enterpriseToken. allowed values are 10, 20 and 30.
      required: false
      schema:
        type: string
      example: '20'
    Subject-Token-Type:
      description: specifies the authorisation mechanism. Conditional mandatory  (required when Subject (end-user) validation and/or reach or authorization check with CASPER is based on legacy MSEC Token and enterprise token is not present )
      in: header
      name: Subject-Token-Type
      schema:
        type: string
        enum:
          - MSEC
      example: MSEC
    Subject-Token:
      name: Subject-Token
      in: header
      description: the consumer security token. Conditional mandatory (required when Subject (end-user) validation and/or reach or authorization check with CASPER is based on legacy MSEC Token and enterprise token is not present)
      schema:
        type: string
      example: VGhpcyBpcyBhIG5pY2UgdGV4dCBlbmNvZGVkIGluIEJhc2U2NA==
    Trace-Id:
      name: Trace-Id
      in: header
      description: Unique end-2-end trace id received from the consumer
      schema:
        type: string
      example: VGhpcyBpcyBhIG5pY2UgdGV4dCBlbmNvZGVkIGluIEJhc2U2NA==
    Referer:
      in: "header"
      name: "Referer"
      description: "The HTTP Referer request header contains the absolute or partial address from which a resource has been requested. The Referer header allows a server to identify referring pages that people are visiting from or where requested resources are being used."
      required: false
      schema:
        type: string
        example: "12355678910"
    User-Agent:
      in: "header"
      name: "User-Agent"
      description: "User agent used in the session."
      required: false
      schema:
        type: string
        example: "1233455566"
    Accept-Language:
      name: Accept-Language
      in: header
      description: |-
        Language code which should be used to generate the documents. If filled, the provided language code will be used, otherwise the default language code nl will be used. Language code should be given as per ISO 639-1 standard.
      schema:
        type: string
        pattern: '^[a-z][a-z]$'
      example: nl
  schemas:
    OrderStatus:
      description: Status of the order placed. See the link for details - https://confluence.int.abnamro.com/pages/viewpage.action?pageId=485286367
      example: FULFILMENT_IN_PROGRESS
      type: string
      enum:
        - DRAFT
        - FAILED
        - REJECTED
        - INITIATED
        - CONFIRMED
        - SIGNING_INITIATED
        - PARTIALLY_SIGNED
        - FULLY_SIGNED
        - FULFILMENT_IN_PROGRESS
        - FULFILLED
        - CLOSED
        - CANCELLED
        - EXPIRED
        - CANNOT_BE_FULFILLED
    OrderItemStatus:
      description: Status of an order item in an order
      example: FULFILMENT_IN_PROGRESS
      type: string
      enum:
        - DRAFT
        - FAILED
        - REJECTED
        - INITIATED
        - CONFIRMED
        - SIGNING_INITIATED
        - PARTIALLY_SIGNED
        - FULLY_SIGNED
        - SIGN_ITEM_DELETED
        - SIGN_ITEM_EXPIRED
        - FULFILMENT_IN_PROGRESS
        - FULFILMENT_INTERRUPTED
        - FULFILLED
        - CLOSED
        - CANCELLED
        - EXPIRED
        - CANNOT_BE_FULFILLED
        - COMMUNICATION_DONE
    Errors:
      description: This contains a list of errors returned by the API
      type: object
      properties:
        errors:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      required:
        - code
        - message
        - status
      properties:
        code:
          description: A unique and meaningful code for the error
          type: string
        message:
          description: >-
            This contains a human readable description for the code and is
            specifically meant for debug purposes
          type: string
        status:
          description: >-
            The HTTP response status code under which the code has been
            categorized
          type: integer
          format: int32
        traceId:
          description: >-
            The unique id sent in the request header for end to end traceability
            of an API call especially in case of errors
          type: string
        params:
          type: array
          description: >-
            This contains dynamic values which need to be returned sometimes by
            the API in addition to the code
          minItems: 0
          maxItems: 10
          items:
            type: string
    CreateOrderRequest:
      description: >-
        Details of the Order, in general, along with details of all requested
        Product(s) in the Order.
      type: object
      required:
        - orderRequestGeneralDetails
        - orderRequestProductDetails
      properties:
        orderRequestGeneralDetails:
          $ref: '#/components/schemas/OrderRequestGeneralDetails'
        orderRequestProductDetails:
          $ref: '#/components/schemas/OrderRequestProductDetails'
    OrderRequestGeneralDetails:
      description: General details of a new Order.
      type: object
      required:
        - correlationId
      properties:
        correlationId:
          description: >-
            Unique identifier for an Order (if applicable), from Consumer
            application. For Consumer application, they may maintain correlation
            between Order ID (in response) of this API and their own Unique ID
            for the Order being placed. correlationId will be returned back
            as-is in response of the API for Consumer application's reference.
          type: string
          example: 6F9619FF-8B86-D011-B42D-00C04FC964FF
        dossierId:
          description: >-
            Unique Id of a Dossier for the Order, if already created by Consumer
            application. If not available, a new Dossier (DDE) will be requested
            by the API. Thus, this is an optional attribute
          type: string
          example: af1000000000123456
        salesChannel:
          description: >-
            Sales channel from where order is placed. ----------
            INTERNET_BANKING : Internet Banking MOBILE_BANKING: Mobile Banking
            (ABN AMRO APP) INTERNET_OPEN_WEBSITE: Public website of ABN AMRO
            (also known as Open Domain). VRS_SELF_SERVICE_CC: Voice Response
            System, self service at Call Center. BRANCH_RETAIL_BANKING: Branch
            Office - Retail Banking DISTRICT_OFFICE_R_PB: District Office -
            Retail and Private Banking PRIVATE_BANKING: Private Office (Mees
            Pierson) BRANCH_COMMERCIAL_BANKING: Branch Office - Commercial
            Banking DISTRICT_OFFICE_C_MB: District Office - Commercial and
            Merchant Banking ASC: ABN AMRO Service Center FULFILMENT_OFFICE:
            Fulfilment office (Accounts & Customers) INTERMEDIARY: Intermediary
            or Agent that sells products of the Bank. OTHER: Any other channel,
            not listed above.
          type: string
          enum:
            - INTERNET_BANKING
            - MOBILE_BANKING
            - INTERNET_OPEN_WEBSITE
            - VRS_SELF_SERVICE_CC
            - BRANCH_RETAIL_BANKING
            - BRANCH_COMMERCIAL_BANKING
            - PRIVATE_BANKING
            - DISTRICT_OFFICE_R_PB
            - DISTRICT_OFFICE_C_MB
            - ASC
            - FULFILMENT_OFFICE
            - INTERMEDIARY
            - OTHER
    OrderRequestProductDetails:
      description: >-
        List of details of 1 or more of the requested daily banking product(s) in the Order
      type: array
      minItems: 1
      maxItems: 5
      items:
        $ref: '#/components/schemas/ProductRequest'
      example:
        - agreementPartyClusterId: 13274929
          productId: 3621
    ProductRequest:
      description: Basic input from calling API for buying/servicing a product
      type: object
      required:
        - agreementPartyClusterId
        - productId
      properties:
        agreementPartyClusterId:
          description: >-
            Identification of the individual or organisation for whom the product will be bought/serviced
          type: integer
          format: int32
          example: 13274929
        productId:
          description: >-
            The product id of the product which will be bought/serviced
          type: integer
          format: int32
          example: 3621
        configurationItems:
          description: a collection of configuration items that the customer (or channel) has asked for as part of requesting this product
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationItem'
          minItems: 0
          maxItems: 50
    ProductOrder:
      description: Contains the details of an order
      type: object
      required:
        - orderGeneralDetails
        - orderItems
      properties:
        orderGeneralDetails:
          $ref: '#/components/schemas/OrderGeneralDetails'
        orderItems:
          $ref: '#/components/schemas/OrderItemList'
    OrderGeneralDetails:
      description: General details of an accepted Order.
      type: object
      required:
        - orderId
        - correlationId
        - orderStatus
        - dossierId
        - orderItemsCount
      properties:
        orderId:
          description: Unique identifier of the order created.
          type: integer
          format: int64
          example: '1900237965'
        correlationId:
          description: >-
            Unique identifier for an Order (if applicable), from Consumer
            application.
          type: string
          example: 6F9619FF-8B86-D011-B42D-00C04FC964FF
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        dossierId:
          description: >-
            Unique Id of a Dossier for the Order. If it was already created and
            passed in the request by Consumer application - then same is
            returned here. Otherwise, a new Dossier (DDE) is created by the API
            and Id of that is returned here.
          type: string
          example: af1000000000123456
        orderItemsCount:
          description: Number of order items in this order
          type: integer
          format: int32
          example: 1
    OrderItemList:
      description: Details of various Order Items which are part of the Product Order.
      type: array
      minItems: 1
      maxItems: 5
      items:
        $ref: '#/components/schemas/OrderItem'
    OrderItem:
      description: Details of individual Order Item.
      type: object
      required:
        - agreementPartyClusterId
        - productId
        - orderItemStatus
      allOf:
        - $ref: '#/components/schemas/OrderItemBrief'
      properties:
        agreementId:
          description: >-
            The agreementId generated for the product. For example, for Direct
            Savings it will be the generated IBAN
          type: string
          example: NL56ABNA0987654321
        signObjectId:
          description: Contains the Id of the sign object created for the product
          type: string
          example: 56df2f8c-e075-4136-a71e-d2a14ba046c7
        documents:
          description: >-
            This lists the documents which are relevant for the specific order
            item
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDocument'
          minItems: 0
          maxItems: 350
        configurationItems:
          description: a collection of configuration items that the customer (or channel) has asked for as part of requesting this product
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationItem'
          minItems: 0
          maxItems: 50
    OrderItemDocument:
      description: Details of individual Document.
      type: object
      required:
        - documentId
        - documentName
      properties:
        documentId:
          description: Unique document id required to retrieve the document.
          type: string
          example: drm_1234567890
        documentName:
          description: Business meaningful name of the document.
          type: string
          example: Voorwaarden Direct Sparen
        documentType:
          description: The type of document. Can be either a contract or conditions
          example: CONTRACT
          type: string
          enum:
            - CONTRACT
            - CONDITIONS
        documentLanguage:
          description: The language in which the document is written
          example: NL
          type: string
          enum:
            - NL
            - EN
            - DE
    ProductOrderList:
      description: Details of all the product orders based on the search criteria
      type: object
      required:
        - productOrders
      properties:
        totalNumberOfElements:
          description: This contains total number of records in the database matching the search criteria. This is returned if `includeTotalNumberOfElements` is set to true in the input
          type: integer
          format: int32
          example: 200
        currentPage:
          description: Shows the current page number in the list of pages which contains retrieved product orders
          type: integer
          format: int32
          example: 2
        totalNumberOfPages:
          description: Shows the total number of pages which contains retrieved product orders
          type: integer
          format: int32
          example: 20
        productOrders:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ProductOrderBrief'
    ProductOrderBrief:
      description: Contains order and order item details of a product order
      type: object
      required:
        - orderGeneralDetails
        - orderItems
      properties:
        orderGeneralDetails:
          $ref: '#/components/schemas/OrderGeneralDetails'
        orderItems:
          $ref: '#/components/schemas/OrderItemBriefList'
    OrderItemBriefList:
      description: Brief details of various Order Items which are part of the Product Order.
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: '#/components/schemas/OrderItemBrief'
    OrderItemBrief:
      description: Brief details of individual Order Item.
      type: object
      required:
        - orderItemId
        - agreementPartyClusterId
        - productId
        - orderItemStatus
      properties:
        orderItemId:
          description: The unique id for each order item
          type: integer
          format: int32
          example: 98765432
        agreementPartyClusterId:
          description: >-
            Identification of the individual or organisation for whom product is
            requested.
          type: integer
          format: int32
          example: 1327492
        productId:
          description: One of the requested product(s) in the Order request.
          type: integer
          format: int32
          example: 3621
        orderItemStatus:
          $ref: '#/components/schemas/OrderItemStatus'
    ConfigurationItem:
      type: object
      required:
        - itemId
        - value
      properties:
        itemId:
          description: the identifier for the configuration item
          type: string
          example: 'statement.frequency'
        value:
          description: the value chosen (by customer or by channel) for the current configuration item
          type: string
          example: 'MONTHLY'